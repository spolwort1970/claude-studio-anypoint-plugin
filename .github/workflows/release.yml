name: Release

# HOW TO RELEASE
#   Actions tab -> "Release" (left sidebar) -> "Run workflow" button -> Run workflow.
#   That's it. Leave the version box empty and it picks the next one for you.
#
# What it does: builds the plugin, tags the commit, publishes the p2 update site
# to the gh-pages branch, and creates a GitHub Release with the jar and a zipped
# update site attached.
#
# Pushing a v* tag by hand also works, if you ever prefer that.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leave empty to auto-number, e.g. 1.0.4)'
        required: false
        default: ''
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need full history so tags are visible

      - name: Work out the version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"        # tag push: use the tag
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"       # typed into the box
            VERSION="${VERSION#v}"
          else
            VERSION="1.0.${GITHUB_RUN_NUMBER}"    # nothing given: auto-number
          fi
          echo "version=${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"       >> "$GITHUB_OUTPUT"
          echo "Releasing v${VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Tag the commit
        if: github.ref_type != 'tag'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — stopping so nothing is overwritten."
            exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Zip the update site
        run: |
          cd org.claudecodestudio.site/target/repository
          zip -r "$GITHUB_WORKSPACE/claude-code-studio-update-site-${{ steps.ver.outputs.tag }}.zip" .

      - name: Publish update site to gh-pages
        run: |
          SITE="$GITHUB_WORKSPACE/org.claudecodestudio.site/target/repository"
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages 2>/dev/null || {
              git clone --depth 1 \
                "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
              cd gh-pages && git checkout --orphan gh-pages && git rm -rf . >/dev/null && cd ..
            }

          find gh-pages -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll -exec rm -rf {} +
          cp -r "$SITE"/. gh-pages/
          touch gh-pages/.nojekyll   # p2 uses folders Jekyll would otherwise skip

          cd gh-pages
          git add -A
          git diff --staged --quiet || git commit -m "Update site for ${{ steps.ver.outputs.tag }}"
          git push origin gh-pages

      - name: Name the jar after the release
        run: |
          cp org.claudecodestudio.plugin/target/org.claudecodestudio.plugin-*.jar \
             "claude-studio-anypoint-plugin-${{ steps.ver.outputs.tag }}.jar"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            "claude-studio-anypoint-plugin-${{ steps.ver.outputs.tag }}.jar" \
            "claude-code-studio-update-site-${{ steps.ver.outputs.tag }}.zip"
