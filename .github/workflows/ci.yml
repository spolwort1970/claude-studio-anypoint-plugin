name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B clean package -DskipTests

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: org.claudecodestudio.plugin/target/*.jar
          if-no-files-found: error

      - name: Upload p2 update site
        uses: actions/upload-artifact@v4
        with:
          name: update-site
          path: org.claudecodestudio.site/target/repository/
          if-no-files-found: error
